<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wireframeing_gammon</title>

    <style>

       .page{
        width: 1920px;
        height: 2160px;
        background-color: rgb(255, 255, 255);
       }

       .hero{
        width: 1920px;
        height: 1080px;
        background-color: rgb(155, 155, 155);
       }

       .top_bar{
        width: 1920px;
        height: 100px;
        background-color: rgb(85, 85, 85);
        display: flex;
        justify-content: space-between;
       }

       .bar_left{
        width: 685px;
        height: 100px;
        background-color: rgb(35, 35, 35);
        float: left;
       }

       .bar_right{
        width: 280px;
        height: 100px;
        background-color: rgb(35, 35, 35);
        float: right;
       }

       .city_scape{
        width: 1920px;
        height: 238px;
        background-color: rgb(36, 36, 36);
       }

       .bottom{
        width: 1920px;
        height: 840px;
        background-color: rgb(218, 218, 218);
        display: flex;
        justify-content: space-around;
       }

       .collums{
        width: 317px;
        height: 583px;
        background-color: rgb(100, 100, 100);
        float: down;
        display: flex;
        flex-direction: column;
       }

       .collum_top{
        width: 317px;
        height: 212px;
        background-color: rgb(50, 50, 50);
        float: top;
       }

       .collum_bottom{
        width: 317px;
        height: 119px;
        background-color: rgb(25, 25, 25);
        float: bottom;
       }
    </style>

</head>

<body>

    <div class="page">

        <div class="hero">

            <div class="top_bar">

                <div class="bar_left">

                </div>

                <div class="bar_right">

                </div>

            </div>

        </div>

        <div class="city_scape"></div>

        <div class="bottom">

            <div class="collums">

                <div class="collum_top"></div>
                
                <div class="collum_bottom"></div>

            </div>

            <div class="collums">

                <div class="collum_top"></div>

                <div class="collum_bottom"></div>

            </div>

            <div class="collums">

                <div class="collum_top"></div>

                <div class="collum_bottom"></div>

            </div>
        
        </div>

    </div>
    
</body>

</html>
