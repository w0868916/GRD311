<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wireframeing_gammon</title>

    <style>

       .page_top{
        width: 1920px;
        height: 2160px;
        background-color: rgb(255, 255, 255);
       }

       .hero{
        width: 1920px;
        height: 1080px;
        background-color: rgb(155, 155, 155);
       }

       .top_bar{
        width: 1920px;
        height: 100px;
        background-color: rgb(85, 85, 85);
        display: flex;
        justify-content: space-between;
       }

       .bar_left{
        width: 685px;
        height: 100px;
        background-color: rgb(35, 35, 35);
        float: left;
       }

       .bar_right{
        width: 280px;
        height: 100px;
        background-color: rgb(35, 35, 35);
        float: right;
       }

       .text_box{
        width: 350px;
        height: 279px;
        background-color: rgb(35, 35, 35);
        margin-left: 105px;
        margin-top: 645px;
       }

       .text_box_top{
        width: 350px;
        height: 236px;
        background-color: rgb(80, 80, 80);
       }

       .text_box_bottom{
        width: 350px;
        height: 43px;
        background-color: rgb(35, 35, 35);
       }

       .bottom_type{
        width: 1920px;
        height: 238px;
        background-color: rgb(218, 218, 218);

       }

       .bottom_page{
        width: 1920px;
        height: 842px;
        background-color: rgb(155, 155, 155);
        display: flex;
        justify-content: space-around;
       }

       .city_scape{
        width: 1920px;
        height: 339px;
        background-color: rgb(65, 65, 65);
        position: absolute;
       }

       .collums{
        width: 317px;
        height: 583px;
        background-color: rgb(100, 100, 100);
        margin-top: 239px;
        z-index: 2;
       }

        .collums_top{
        width: 317px;
        height: 212px;
        background-color: rgb(37, 37, 37);
       }

        .collums_middle{
        width: 317px;
        height: 250px;
        background-color: rgb(80, 80, 80);
       }

        .collums_bottom{
        width: 317px;
        height: 119px;
        background-color: rgb(37, 37, 37);
       }
    </style>

</head>

<body>

    <div class="page_top">

        <div class="hero">

            <div class="top_bar">

                <div class="bar_left"></div>

                <div class="bar_right"></div>

            </div>

            <div class="text_box">

                <div class="text_box_top"></div>

                <div class="text_box_bottom"></div>

            </div>
        </div>

        <div class="bottom_type"></div>

        <div class="bottom_page">

            <div class="city_scape"></div>

            <div class="collums">

                <div class="collums_top"></div>

                <div class="collums_middle"></div>

                <div class="collums_bottom"></div> 

            </div>

            <div class="collums">

                <div class="collums_top"></div>

                <div class="collums_middle"></div>

                <div class="collums_bottom"></div> 

            </div>

            <div class="collums">

                <div class="collums_top"></div>

                <div class="collums_middle"></div>

                <div class="collums_bottom"></div> 

            </div>

            <div class="collums">

                <div class="collums_top"></div>

                <div class="collums_middle"></div>

                <div class="collums_bottom"></div> 

            </div>

        </div>

    </div>
    
</body>

</html>
